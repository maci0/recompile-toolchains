# Static analysis gate: the same `make lint` entry point developers run
# locally.  The environment is installed from the committed uv.lock with
# `--locked` (drift fails loudly), so CI gets byte-identical, sha256-verified
# artifacts — not a fresh pip resolution that merely agrees on version pins.
name: lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history: `make verify` checks the generated images against the
      # last revision that held the hand-written ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15.0"
      - name: Install pinned analyzers
        run: uv sync --group lint --locked
      - name: Run static analysis
        run: uv run --no-sync make lint
      - name: Run behavioral tests
        run: uv run --no-sync make test
      - name: Verify generated images against the hand-written ones
        run: uv run --no-sync make verify
